
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HopeBridge</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Hope<span>Bridge.</span></a>
            <a href="index.html" class="back-link">Back to Home</a>
        </nav>
    </header>

    <main class="auth-container login-container">
        <div class="auth-card">
            <div class="auth-heading">
                <span class="tag">WELCOME BACK</span>
                <h1>Login to HopeBridge</h1>
                <p>Continue making a difference.</p>
            </div>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit" class="auth-submit">Login</button>
                <p id="loginMessage" class="form-message"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </p>
        </div>

        <div class="auth-side">
            <h2>Welcome to a place<br>where kindness matters.</h2>
            <p>Access your account to explore essential supply wishlists and birthday meal sponsorship opportunities.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
</body>
</html>
